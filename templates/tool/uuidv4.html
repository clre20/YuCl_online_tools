<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuCl 線上工具 | UUID 生成器</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='ico/YuCl64.png') }}">
    <meta name="description" content="YuCl UUID 生成器，快速生成高品質的唯一識別碼">
    
    <!-- Fonts and Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <script src="{{ url_for('static', filename='js/page_tracker.js') }}"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.4);
            --accent-cyan: #06b6d4;
            --bg-dark: #090d16;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        /* --- 定製捲軸 (Scrollbar) --- */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 10px; background-clip: content-box; border: 2px solid transparent; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); background-clip: content-box; }
        * { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.15) transparent; margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 24px 40px;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(9, 13, 22, 0.45) 0%, rgba(9, 13, 22, 0.88) 100%);
            z-index: 0; pointer-events: none;
        }

        .container { width: 100%; max-width: 600px; z-index: 1; display: flex; flex-direction: column; gap: 2rem; }

        .card {
            background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
            max-height: calc(100vh - 120px);
            max-height: calc(100dvh - 120px);
            overflow-y: auto;
        }
        .card:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); }

        .header-section { text-align: center; margin-bottom: 2rem; }
        h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 12px; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.25); }
        h1 i { color: #8b5cf6; }
        .title-accent { background: linear-gradient(135deg, #8b5cf6, #06b6d4, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

        /* 初始 UUID 顯示 */
        .initial-uuid-display {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        .initial-uuid-display p {
            color: var(--accent-cyan);
            font-size: 1.15rem;
            font-family: monospace;
            font-weight: 700;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .copy-btn {
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(37, 99, 235, 0.3);
            width: 40px; height: 40px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .copy-btn:hover { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        .divider { margin: 1.5rem 0; border: 0; border-top: 1px solid var(--card-border); }

        h3 { color: white; font-size: 1.25rem; margin-bottom: 1rem; font-weight: 700; }

        .form-group { margin-bottom: 1.5rem; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 16px; color: var(--text-muted); font-size: 1.1rem; }
        input[type="number"] { width: 100%; padding: 14px 16px 14px 48px; border: 1px solid var(--card-border); border-radius: 14px; background: rgba(0, 0, 0, 0.25); color: white; font-size: 1rem; outline: none; transition: all 0.3s ease; }
        input[type="number"]:focus { border-color: var(--accent-cyan); background: rgba(0, 0, 0, 0.35); box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2); }

        .submit-btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: 700; cursor: pointer; background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%); color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(6, 182, 212, 0.4); filter: brightness(1.1); }
        
        .copy-all-btn { background: linear-gradient(135deg, #d33c8c, #a73c8c); margin-top: 1.5rem; }

        /* 結果列表容器 */
        #moreUuidsResultContainer {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .result-item { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 16px; color: var(--text-main); font-family: monospace; font-size: 0.95rem; animation: fadeIn 0.4s ease; transition: all 0.3s; }
        .result-item:hover { background: rgba(255, 255, 255, 0.06); transform: translateX(3px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .back-to-home { position: absolute; top: 24px; left: 24px; color: var(--text-muted); text-decoration: none; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; transition: color 0.3s; z-index: 10; }
        .back-to-home:hover { color: var(--text-main); }
        
        #messageContainer { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(6, 182, 212, 0.5); color: white; padding: 12px 24px; border-radius: 14px; opacity: 0; transition: opacity 0.5s; z-index: 1000; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4); font-weight: 600; }
        #messageContainer.show { opacity: 1; }

        .error { color: #ff4444; font-weight: bold; margin-top: 10px; text-align: center; }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                justify-content: flex-start;
                padding: 16px 12px;
                overflow: hidden;
                height: 100vh;
                height: 100dvh;
            }
            .back-to-home {
                position: static;
                margin-bottom: 12px;
                align-self: flex-start;
                font-size: 0.85rem;
                flex-shrink: 0;
            }
            .card {
                padding: 1.5rem;
                border-radius: 20px;
                max-height: calc(100vh - 90px);
                max-height: calc(100dvh - 90px);
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-to-home"><i class="fas fa-arrow-left"></i><span>返回首頁</span></a>
    
    <div class="container">
        <div class="card">
            <div class="header-section">
                <h1>UUID <span class="title-accent">生成器</span></h1>
                <p class="subtitle">快速生成高品質的 v4 隨機唯一識別碼</p>
            </div>

            <div id="initialUuidDisplay" class="initial-uuid-display">
                <!-- Initial UUID logic injects here -->
            </div>
            
            <div id="errorContainer"></div>

            <hr class="divider">

            <h3>生成更多 UUID</h3>
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-hashtag"></i>
                    <input type="number" id="uuidCount" placeholder="輸入數量 (1-50)" min="1" max="50" value="5">
                </div>
            </div>
            
            <button onclick="generateMoreUuids()" class="submit-btn">
                <i class="fas fa-sync-alt"></i>
                <span>生成</span>
            </button>

            <button id="copyAllUuidsBtn" class="submit-btn copy-all-btn" style="display:none;">
                <i class="fas fa-copy"></i>
                <span>複製所有 UUID</span>
            </button>

            <div id="moreUuidsResultContainer">
                <!-- Multiple results logic injects here -->
            </div>
        </div>
    </div>
    
    <div id="messageContainer"></div>

    <script>
        function showMessage(text, duration = 3000) {
            const messageContainer = document.getElementById("messageContainer");
            messageContainer.textContent = text;
            messageContainer.classList.add("show");
            setTimeout(() => messageContainer.classList.remove("show"), duration);
        }
        
        async function copyUuid(uuidText) {
            try {
                await navigator.clipboard.writeText(uuidText);
                showMessage("UUID 已複製到剪貼板");
            } catch (err) {
                showMessage("複製失敗，請手動複製");
            }
        }

        let currentGeneratedUuids = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await generateUuids(1, 'initialUuidDisplay', false);
        });

        async function generateMoreUuids() {
            const uuidCountInput = document.getElementById("uuidCount");
            const count = parseInt(uuidCountInput.value, 10);
            const errorContainer = document.getElementById("errorContainer");
            errorContainer.innerHTML = "";
            
            if (isNaN(count) || count <= 0 || count > 50) {
                errorContainer.innerHTML = `<div class="error">請輸入一個 1 到 50 之間的數字。</div>`;
                return;
            }
            
            const moreUuidsResultContainer = document.getElementById("moreUuidsResultContainer");
            moreUuidsResultContainer.innerHTML = "";
            document.getElementById("copyAllUuidsBtn").style.display = 'none';
            currentGeneratedUuids = [];

            await generateUuids(count, 'moreUuidsResultContainer', true);

            // 自動平滑捲動卡片到底部以顯示生成結果
            const card = document.querySelector('.card');
            if (card) {
                setTimeout(() => {
                    card.scrollTo({
                        top: card.scrollHeight,
                        behavior: 'smooth'
                    });
                }, 100);
            }
        }

        async function generateUuids(count, containerId, showCopyAllButton) {
            const container = document.getElementById(containerId);
            const errorContainer = document.getElementById("errorContainer");
            errorContainer.innerHTML = "";

            try {
                const response = await fetch(`/generate_uuid/${count}`);
                const result = await response.json();

                if (response.ok && result.uuids) {
                    container.innerHTML = "";
                    if (containerId === 'moreUuidsResultContainer') {
                        currentGeneratedUuids = result.uuids; 
                        result.uuids.forEach(uuid => {
                            const uuidDiv = document.createElement('div');
                            uuidDiv.classList.add('result-item');
                            uuidDiv.textContent = uuid;
                            container.appendChild(uuidDiv);
                        });
                    } else {
                        // initialUuidDisplay
                        const uuid = result.uuids[0];
                        const uuidP = document.createElement('p');
                        uuidP.textContent = uuid;
                        
                        const copyButton = document.createElement('button');
                        copyButton.classList.add('copy-btn');
                        copyButton.innerHTML = `<i class="fas fa-copy"></i>`;
                        copyButton.onclick = () => copyUuid(uuid);
                        
                        container.appendChild(uuidP);
                        container.appendChild(copyButton);
                    }

                    if (showCopyAllButton && currentGeneratedUuids.length > 0) {
                        document.getElementById("copyAllUuidsBtn").style.display = 'flex';
                    } else {
                        document.getElementById("copyAllUuidsBtn").style.display = 'none';
                    }
                } else {
                    errorContainer.innerHTML = `<div class="error">${result.error || '生成失敗。'}</div>`;
                }
            } catch (error) {
                errorContainer.innerHTML = `<div class="error">網路錯誤，請稍後再試。</div>`;
            }
        }

        document.getElementById("copyAllUuidsBtn").addEventListener('click', async () => {
            if (currentGeneratedUuids.length > 0) {
                await copyUuid(currentGeneratedUuids.join('\n'));
            }
        });
    </script>
</body>
</html>
