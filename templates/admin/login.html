<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuCl Admin | 登入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #f0f2f5;
            color: #333;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft JhengHei', system-ui, -apple-system, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border: none;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            color: #333;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
        }
        .form-control:focus {
            background-color: #fff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #0d6efd 0%, #00d4ff 100%);
            border: none;
            width: 100%;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        .logo-icon {
            font-size: 3rem;
            color: #0d6efd;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="logo-icon"><i class="fa-solid fa-circle-user"></i></div>
            <h3 class="fw-bold">YuCl 管理登入</h3>
            <p class="text-muted small">請輸入您的管理員帳號與密碼</p>
        </div>

        <form id="loginForm">
            <div class="mb-1 small fw-bold text-secondary">管理員信箱</div>
            <input type="email" id="email" name="email" class="form-control" required placeholder="example@mail.com">
            
            <div class="mb-1 small fw-bold text-secondary">安全密碼</div>
            <input type="password" id="password" name="password" class="form-control" required placeholder="請輸入密碼">
            
            <button type="submit" class="btn btn-primary mt-2">確認登入</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            
            // 顯示載入中提示
            Swal.fire({
                title: '驗證中',
                text: '正在檢查管理員憑據...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const response = await fetch("{{ url_for('admin_console.login') }}", {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok && result.status === 'success') {
                    Swal.fire({
                        title: '登入成功',
                        text: result.message,
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = "{{ url_for('admin_console.index') }}";
                    });
                } else {
                    Swal.fire({
                        title: '登入失敗',
                        text: result.message || '請檢查帳號密碼',
                        icon: 'error'
                    });
                }
            } catch (error) {
                Swal.fire('錯誤', '系統連線失敗', 'error');
            }
        });
    </script>
</body>
</html>
